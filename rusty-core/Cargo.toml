[package]
name = "rusty-agent-runtime"
version = "0.9.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/rusty-agent-runtime"
readme = "README.md"
description = "The durable agent runtime built in Rust — core graph engine: typed channels with reducers, Pregel/BSP super-step execution, checkpoints, interrupts, and streaming."
keywords = ["agent", "graph", "llm", "orchestration", "langgraph"]
categories = ["asynchronous", "network-programming"]
# Explicit [[bench]] targets only — autodiscovery would also pick up the
# shared helper module under benches/common/.
autobenches = false

# NOTE: Cargo.toml and src/lib.rs are owned EXCLUSIVELY by the scaffold engineer.
# Do not edit them in implementation PRs; request changes instead.

[dependencies]
tokio = { version = "1", features = ["full"] }
# Cooperative cancellation (R0.6 wave 2c): `RunConfig::with_cancellation`
# threads a `CancellationToken` into the executor — the same token type the
# worker's lease/heartbeat protocol already uses.
tokio-util = "0.7"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures = "0.3"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# Flight Recorder (R0.5): content hashing for artifact references and journal
# heads, plus the seeded-RNG determinism seam. Minimal features: only the
# RngCore/SeedableRng traits and the ChaCha8 core are used.
sha2 = "0.10"
# Signed run receipts (R0.9 wave 3): Ed25519 over the receipt's canonical
# bytes. Small, pure-Rust, no native code; key generation draws OS entropy
# through `uuid` (below), so no RNG feature is needed here.
ed25519-dalek = "2"
rand = { version = "0.8", default-features = false }
rand_chacha = { version = "0.3", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "json", "chrono"], optional = true }
wasmtime = { version = "47", optional = true }

[features]
postgres = ["dep:sqlx"]
wasm = ["dep:wasmtime"]

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
# Benchmarks only: default features off (no plotters/rayon) to keep bench
# builds lean; results still go to target/criterion as JSON estimates.
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "graph_compile"
harness = false

[[bench]]
name = "node_execution"
harness = false

[[bench]]
name = "parallel_fanout"
harness = false

[[bench]]
name = "reducers"
harness = false

[[bench]]
name = "checkpoint"
harness = false

[[bench]]
name = "interrupt_resume"
harness = false

[[bench]]
name = "state_clone"
harness = false

[[bench]]
name = "checkpoint_placement"
harness = false

[[bench]]
name = "headroom_experiment"
harness = false
