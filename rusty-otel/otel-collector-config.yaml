# OTel Collector configuration for the local rusty-otel stack.
#
# Pipeline: receive OTLP (gRPC + HTTP) -> batch -> Jaeger (OTLP/gRPC) + debug.
# The debug exporter also echoes span summaries to the collector's stdout,
# which is handy for verifying export without opening the Jaeger UI
# (`docker compose logs -f otel-collector`).

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 512

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger, debug]
