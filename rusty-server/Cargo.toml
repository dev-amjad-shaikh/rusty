[package]
name = "rusty-agent-server"
version = "0.9.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/rusty-agent-server"
readme = "README.md"
description = "The durable agent runtime built in Rust — HTTP/SSE server: an Agent-Protocol subset with threads, background runs, checkpoints, and resumable streaming."
keywords = ["agent", "graph", "llm", "server", "langgraph"]
categories = ["asynchronous", "network-programming"]

[features]
# Postgres-backed persistence: `ServerConfig::with_postgres(url)` switches
# both the run checkpointer (core's `PostgresCheckpointer`) and the server
# store (assistants / crons / KV) to Postgres.
postgres = ["dep:sqlx", "rusty-agent-runtime/postgres"]
# R0.9 Rusty Capsules wave 2: the Cedar authorization plane
# (`capsule_policy.rs`) — admission and grant checks, tenant overlays, and
# the revocation-at-next-use recheck — plus the capability host it
# authorizes (core's `wasm` feature). A server built without it refuses
# the capsule policy surface with a typed error (fail closed).
capsules = ["dep:cedar-policy", "rusty-agent-runtime/wasm"]

[dependencies]
rusty-agent-runtime = { path = "../rusty-core", version = "0.9" }
# Wave 4: the server-side candidate evaluator composes `rusty-eval`'s
# experiment runner over live graph preparation plus a versioned dataset
# source; `promote → evaluate` calls it through the learning gate.
rusty-eval = { path = "../rusty-eval", version = "0.1" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
# Graceful shutdown (R0.6 wave 2c): one `CancellationToken` drains the run
# executor, the outbox relay, and the cron scheduler together.
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
cron = "0.12"
futures = "0.3"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Trigger webhooks: HMAC-SHA256 signature verification (`X-Rusty-Signature`)
# and SHA-256 payload hashes for the event log.
hmac = "0.12"
sha2 = "0.10"
# Permissive CORS in `router()` so browser clients (e.g. the Studio) can call
# the API cross-origin. Production deployments should restrict this — see README.
tower-http = { version = "0.6", features = ["cors"] }
sqlx = { version = "0.8", default-features = false, features = [
    "postgres",
    "runtime-tokio-rustls",
    "json",
    "chrono",
], optional = true }
# Cedar policy evaluation for the capsule authorization plane (R0.9 wave 2).
# Server-only by design — the core crate's contracts stay engine-free — and
# pure Rust with no native deps. The major is pinned like the rest.
cedar-policy = { version = "4", optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1", features = ["full", "test-util"] }
# Graceful-shutdown tests drive `serve_with_shutdown` over real sockets.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Trigger tests sign webhook bodies the way an external sender would.
hmac = "0.12"
sha2 = "0.10"
