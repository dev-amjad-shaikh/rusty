[package]
name = "rusty-store"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Storage contract traits for the Rusty platform"

[dependencies]
object_store = "0.12"
sha2 = "0.10"
thiserror = "2"
hex = "0.4"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
