[package]
name = "rusty-worker"
version = "0.3.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/rusty-worker"
readme = "README.md"
description = "The durable agent runtime built in Rust — distributed worker: serve Node handlers over HTTP (POST /execute) and run durable leased activities against the server task queue."
keywords = ["agent", "graph", "llm", "worker", "langgraph"]
categories = ["asynchronous", "network-programming"]

[dependencies]
rusty-agent-runtime = { path = "../rusty-core", version = "0.10" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
