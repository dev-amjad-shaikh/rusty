[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rusty-agent-runtime"
version = "0.4.0"
description = "Zero-dependency, stdlib-only Python client for rusty-server (threads, runs, SSE streaming, time travel, assistants, crons, KV store, durable tasks)"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-APACHE", "LICENSE-MIT"]
keywords = ["rusty", "agents", "langgraph", "sse", "llm", "orchestration"]
authors = [{ name = "Rusty contributors" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
]
# Deliberately empty: this SDK is stdlib-only by design.
dependencies = []

[project.urls]
Homepage = "https://github.com/dev-amjad-shaikh/rusty"
Documentation = "https://github.com/dev-amjad-shaikh/rusty/tree/main/sdks/python"

[tool.hatch.build.targets.wheel]
packages = ["rusty_client"]

[tool.hatch.build.targets.sdist]
include = ["rusty_client", "README.md", "tests"]
